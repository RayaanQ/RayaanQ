name: Refresh profile

on:
  schedule:
    - cron: '23 1 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/stats.mjs'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render stats card
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#d4ff3a&color_dots=#161b22,#2b3a10,#4d6b12,#86b81a,#d4ff3a
            dist/snake-light.svg?color_snake=#3f6a00&color_dots=#ebedf0,#e4f5a8,#c5f02c,#8fbf12,#3f6a00

      - name: Commit changes
        run: |
          cp dist/*.svg assets/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh profile stats" && git push; fi
